<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>旅のしおり</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="book" id="book">

    <!-- 表紙 -->
    <section class="page cover">

      <div class="cover-inner">

        <p class="cover-label">
          TRAVEL BOOK
        </p>

        <h1>
          徳島旅行
        </h1>

        <div class="cover-line"></div>

        <p class="cover-date">
          2026.10.09 — 10.10
        </p>

      </div>

    </section>


    <!-- 通常ページ -->
    <section class="page">

      <header class="page-header">

        <p class="page-number">
          01
        </p>

        <h2>
          JOURNEY
        </h2>

        <p class="page-subtitle">
          旅の予定
        </p>

      </header>


      <div class="page-body">

        <div class="text-field">

          <h3>
            ここに小見出し
          </h3>

          <p>
            ここにテキストを書きます。
            行程や説明、ちょっとしたメモなど、
            自由に入力できます。
          </p>

        </div>


        <div class="text-field">

          <h3>
            ここに小見出し
          </h3>

          <p>
            ここに別の文章を書きます。
          </p>

        </div>

      </div>

    </section>


    <!-- ページ2 -->
    <section class="page">

      <header class="page-header">

        <p class="page-number">
          02
        </p>

        <h2>
          DAY 1
        </h2>

        <p class="page-subtitle">
          October 9
        </p>

      </header>


      <div class="page-body">

        <div class="text-field">

          <h3>
            MORNING
          </h3>

          <p>
            ここにテキスト。
          </p>

        </div>


        <div class="text-field">

          <h3>
            AFTERNOON
          </h3>

          <p>
            ここにテキスト。
          </p>

        </div>


        <div class="text-field">

          <h3>
            NIGHT
          </h3>

          <p>
            ここにテキスト。
          </p>

        </div>

      </div>

    </section>


    <!-- ページ3 -->
    <section class="page">

      <header class="page-header">

        <p class="page-number">
          03
        </p>

        <h2>
          STAY
        </h2>

        <p class="page-subtitle">
          宿泊
        </p>

      </header>


      <div class="page-body">

        <div class="text-field large">

          <h3>
            HOTEL
          </h3>

          <p>
            宿についての情報。
          </p>

        </div>

      </div>

    </section>

  </main>


  <!-- 下部ナビ -->

  <nav class="bottom-nav">

    <button onclick="movePage(-1)">
      ←
    </button>

    <span id="pageIndicator">
      1 / 4
    </span>

    <button onclick="movePage(1)">
      →
    </button>

  </nav>


  <script src="script.js"></script>

</body>
</html>
